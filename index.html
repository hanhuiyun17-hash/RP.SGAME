<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 당신의 철학자는</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;

            background: #f7d7e3;
            color: #3c2630;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
        }

        .screen {
            display: none;

            width: 100%;
            max-width: 430px;

            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(45px, env(safe-area-inset-top))
                24px
                max(28px, env(safe-area-inset-bottom));

            flex-direction: column;

            background:
                radial-gradient(
                    circle at 85% 10%,
                    rgba(255, 255, 255, 0.75),
                    transparent 27%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    rgba(255, 185, 210, 0.35),
                    transparent 35%
                ),
                linear-gradient(
                    180deg,
                    #ffcfe0 0%,
                    #ffe2ec 52%,
                    #fff1f6 100%
                );
        }

        .screen.active {
            display: flex;
        }

        .start-screen {
            justify-content: space-between;
        }

        .start-content {
            margin-top: 80px;
        }

        .brand {
            margin-bottom: 20px;

            color: #df4e83;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .start-title {
            font-size: 41px;
            line-height: 1.2;

            letter-spacing: -2px;
        }

        .pink-text {
            color: #e84f87;
        }

        .start-description {
            margin-top: 24px;

            color: #845b6b;

            font-size: 16px;
            line-height: 1.75;
        }

        .start-box {
            margin-top: 35px;

            padding: 20px;

            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.45);

            color: #79505f;

            font-size: 14px;
            line-height: 1.7;

            backdrop-filter: blur(10px);
        }

        .main-button {
            width: 100%;
            height: 60px;

            border: none;
            border-radius: 19px;

            background: #ee5b91;
            color: white;

            font-size: 17px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 28px
                rgba(218, 65, 121, 0.25);

            transition:
                transform 0.15s ease,
                opacity 0.2s ease;
        }

        .main-button:active {
            transform: scale(0.98);
        }

        .main-button.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-button {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 14px;

            background: rgba(255, 255, 255, 0.65);
            color: #6e4354;

            font-size: 22px;
            font-weight: 700;

            cursor: pointer;
        }

        .step {
            color: #bd6687;

            font-size: 14px;
            font-weight: 800;
        }

        .progress {
            width: 100%;
            height: 7px;

            margin-top: 24px;

            overflow: hidden;

            border-radius: 100px;

            background: rgba(255, 255, 255, 0.65);
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            border-radius: 100px;

            background: #ee5b91;

            transition: width 0.3s ease;
        }

        .question-area {
            margin-top: 55px;
        }

        .question-number {
            margin-bottom: 13px;

            color: #e04f84;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }

        .question-title {
            font-size: 30px;
            line-height: 1.35;

            letter-spacing: -1.2px;
        }

        .question-description {
            margin-top: 12px;

            color: #8b6372;

            font-size: 15px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;

            gap: 13px;

            margin-top: 38px;
        }

        .option {
            width: 100%;
            min-height: 70px;

            padding: 0 21px;

            border: 2px solid transparent;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.72);
            color: #4d303b;

            font-size: 17px;
            font-weight: 800;

            text-align: left;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(174, 75, 111, 0.06);

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                border 0.2s ease;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option.selected {
            border-color: #ee5b91;

            background: white;
            color: #e34880;

            box-shadow:
                0 9px 25px
                rgba(218, 65, 121, 0.13);
        }

        .option.skip-option {
            color: #9b7181;
        }

        .bottom {
            margin-top: auto;
            padding-top: 28px;
        }

        .result-screen {
            text-align: center;
        }

        .result-top {
            margin-top: 30px;
        }

        .result-label {
            color: #e04f84;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .result-heading {
            margin-top: 13px;

            font-size: 25px;
            line-height: 1.4;

            letter-spacing: -1px;
        }

        .philosopher-card {
            width: 100%;

            margin-top: 30px;
            padding: 30px 22px;

            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.7);

            box-shadow:
                0 18px 45px
                rgba(210, 72, 123, 0.13);

            backdrop-filter: blur(10px);
        }

        .philosopher-era {
            color: #c66b8d;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .philosopher-name {
            margin-top: 8px;

            color: #38242c;

            font-size: 38px;
            font-weight: 900;

            letter-spacing: -1.5px;
        }

        .philosopher-description {
            margin-top: 16px;

            color: #e34e84;

            font-size: 18px;
            font-weight: 800;
            line-height: 1.6;
        }

        .divider {
            width: 45px;
            height: 3px;

            margin: 24px auto;

            border-radius: 100px;

            background: #f0a1bd;
        }

        .book-label {
            color: #9a7180;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .book-name {
            margin-top: 8px;

            color: #553945;

            font-size: 17px;
            font-weight: 800;
        }

        .thought {
            margin-top: 22px;

            padding: 17px;

            border-radius: 17px;

            background: #fff2f6;

            color: #754d5c;

            font-size: 14px;
            line-height: 1.7;

            text-align: left;
        }

        .restart-button {
            margin-top: 25px;
        }

        @media (max-width: 370px) {

            .start-title {
                font-size: 36px;
            }

            .question-title {
                font-size: 27px;
            }

            .philosopher-name {
                font-size: 34px;
            }
        }

        @media (min-width: 600px) {

            body {
                background: #f5f5f5;
            }

            .app {
                align-items: center;

                padding: 30px 0;
            }

            .screen {
                min-height: 850px;

                border-radius: 30px;

                box-shadow:
                    0 20px 60px
                    rgba(0, 0, 0, 0.08);
            }
        }
    </style>
</head>

<body>

<main class="app">

    <section
        class="screen start-screen active"
        id="startScreen"
    >

        <div class="start-content">

            <p class="brand">
                PHILOSOPHER TEST
            </p>

            <h1 class="start-title">
                두근두근<br>
                <span class="pink-text">
                    당신의 철학자는
                </span>
            </h1>

            <p class="start-description">
                13개의 질문으로 알아보는<br>
                나와 가장 닮은 철학자
            </p>

            <div class="start-box">
                어려운 철학 지식은 필요 없습니다.
                당신의 생각에 더 가까운 답을
                선택하면 됩니다.
            </div>

        </div>

        <button
            class="main-button"
            id="startButton"
        >
            시작하기
        </button>

    </section>


    <section
        class="screen"
        id="questionScreen"
    >

        <div class="top">

            <button
                class="back-button"
                id="backButton"
            >
                &lt;
            </button>

            <span
                class="step"
                id="stepText"
            >
                1 / 13
            </span>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>


        <div class="question-area">

            <p
                class="question-number"
                id="questionNumber"
            >
                QUESTION 01
            </p>

            <h2
                class="question-title"
                id="questionTitle"
            ></h2>

            <p
                class="question-description"
                id="questionDescription"
            ></p>

        </div>


        <div
            class="options"
            id="options"
        ></div>


        <div class="bottom">

            <button
                class="main-button disabled"
                id="confirmButton"
            >
                확인
            </button>

        </div>

    </section>


    <section
        class="screen result-screen"
        id="resultScreen"
    >

        <div class="result-top">

            <p class="result-label">
                YOUR PHILOSOPHER
            </p>

            <h2 class="result-heading">
                당신과 가장 잘 맞는 철학자는
            </h2>

        </div>


        <div class="philosopher-card">

            <p
                class="philosopher-era"
                id="resultEra"
            ></p>

            <h2
                class="philosopher-name"
                id="resultName"
            ></h2>

            <p
                class="philosopher-description"
                id="resultDescription"
            ></p>

            <div class="divider"></div>

            <p class="book-label">
                대표 저서 또는 문헌
            </p>

            <p
                class="book-name"
                id="resultBook"
            ></p>

            <div
                class="thought"
                id="resultThought"
            ></div>

        </div>


        <button
            class="main-button restart-button"
            id="restartButton"
        >
            다시 하기
        </button>

    </section>

</main>

const diogenes = {

    name: "디오게네스",

    era: "특별 결과",

    book: "디오게네스의 생애와 일화",

    description: "미친 소크라테스",

    thought:
        "관습과 체면에 얽매이지 않고 필요한 것을 최소화하며 자유롭게 살아가는 태도로 유명한 철학자입니다."

};


const answers = {};

let currentQuestion = 0;
let currentSelection = null;


const startScreen =
    document.getElementById("startScreen");

const questionScreen =
    document.getElementById("questionScreen");

const resultScreen =
    document.getElementById("resultScreen");

const startButton =
    document.getElementById("startButton");

const backButton =
    document.getElementById("backButton");

const confirmButton =
    document.getElementById("confirmButton");

const restartButton =
    document.getElementById("restartButton");

const stepText =
    document.getElementById("stepText");

const progressBar =
    document.getElementById("progressBar");

const questionNumber =
    document.getElementById("questionNumber");

const questionTitle =
    document.getElementById("questionTitle");

const questionDescription =
    document.getElementById(
        "questionDescription"
    );

const optionsContainer =
    document.getElementById("options");

const resultEra =
    document.getElementById("resultEra");

const resultName =
    document.getElementById("resultName");

const resultDescription =
    document.getElementById(
        "resultDescription"
    );

const resultBook =
    document.getElementById("resultBook");

const resultThought =
    document.getElementById("resultThought");


function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(function(item) {

            item.classList.remove("active");

        });


    screen.classList.add("active");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function renderQuestion() {

    const question =
        questions[currentQuestion];


    currentSelection =
        answers[question.key] || null;


    stepText.textContent =
        (currentQuestion + 1)
        + " / "
        + questions.length;


    questionNumber.textContent =
        "QUESTION "
        + String(
            currentQuestion + 1
        ).padStart(2, "0");


    questionTitle.textContent =
        question.title;


    questionDescription.textContent =
        question.description;


    const progress =
        (
            (currentQuestion + 1)
            / questions.length
        ) * 100;


    progressBar.style.width =
        progress + "%";


    optionsContainer.innerHTML = "";


    question.options.forEach(
        function(optionData) {

            createOption(
                optionData.text,
                optionData.value,
                false
            );

        }
    );


    createOption(
        "알빠임",
        "dontcare",
        true
    );


    updateConfirmButton();

}


function createOption(
    text,
    value,
    isSkip
) {

    const button =
        document.createElement("button");


    button.className = "option";


    if (isSkip) {

        button.classList.add(
            "skip-option"
        );

    }


    button.textContent = text;

    button.dataset.value = value;


    if (
        currentSelection === value
    ) {

        button.classList.add(
            "selected"
        );

    }


    button.addEventListener(
        "click",
        function() {

            document
                .querySelectorAll(".option")
                .forEach(
                    function(item) {

                        item.classList.remove(
                            "selected"
                        );

                    }
                );


            button.classList.add(
                "selected"
            );


            currentSelection =
                value;


            confirmButton.classList.remove(
                "disabled"
            );

        }
    );


    optionsContainer.appendChild(
        button
    );

}


function updateConfirmButton() {

    if (currentSelection) {

        confirmButton.classList.remove(
            "disabled"
        );

    } else {

        confirmButton.classList.add(
            "disabled"
        );

    }


    if (
        currentQuestion
        === questions.length - 1
    ) {

        confirmButton.textContent =
            "결과 보기";

    } else {

        confirmButton.textContent =
            "확인";

    }

}


function getPhilosopher() {

    const group =
        answers.era
        + "_"
        + answers.region;


    const candidates =
        philosophers.filter(
            function(philosopher) {

                return (
                    philosopher.group
                    === group
                );

            }
        );


    if (candidates.length === 0) {

        return philosophers[0];

    }


    let bestPhilosopher =
        candidates[0];

    let bestScore = -1;


    candidates.forEach(
        function(philosopher) {

            let score = 0;


            Object.values(answers)
                .forEach(
                    function(answer) {

                        if (
                            philosopher.traits
                                .includes(answer)
                        ) {

                            score++;

                        }

                    }
                );


            if (score > bestScore) {

                bestScore = score;

                bestPhilosopher =
                    philosopher;

            }

        }
    );


    return bestPhilosopher;

}


function displayResult(philosopher) {

    resultEra.textContent =
        philosopher.era;


    resultName.textContent =
        philosopher.name;


    resultDescription.textContent =
        philosopher.description;


    resultBook.textContent =
        philosopher.book;


    resultThought.textContent =
        philosopher.thought;


    showScreen(resultScreen);

}


startButton.addEventListener(
    "click",
    function() {

        currentQuestion = 0;
        currentSelection = null;

        showScreen(questionScreen);

        renderQuestion();

    }
);


confirmButton.addEventListener(
    "click",
    function() {

        if (!currentSelection) {
            return;
        }


        if (
            currentSelection
            === "dontcare"
        ) {

            displayResult(
                diogenes
            );

            return;

        }


        const question =
            questions[currentQuestion];


        answers[question.key] =
            currentSelection;


        if (
            currentQuestion
            < questions.length - 1
        ) {

            currentQuestion++;

            renderQuestion();

        } else {

            const philosopher =
                getPhilosopher();


            displayResult(
                philosopher
            );

        }

    }
);


backButton.addEventListener(
    "click",
    function() {

        if (currentQuestion === 0) {

            showScreen(startScreen);

            return;

        }


        currentQuestion--;

        renderQuestion();

    }
);


restartButton.addEventListener(
    "click",
    function() {

        Object
            .keys(answers)
            .forEach(
                function(key) {

                    delete answers[key];

                }
            );


        currentQuestion = 0;
        currentSelection = null;


        showScreen(startScreen);

    }
);

</script>
