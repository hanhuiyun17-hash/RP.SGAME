<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>두근두근 당신의 철학자는</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Apple SD Gothic Neo",
                "Noto Sans KR",
                Arial,
                sans-serif;

            background: #f6d6e2;
            color: #3b2630;
        }

        button {
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
        }

        .screen {
            display: none;

            width: 100%;
            max-width: 430px;

            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(46px, env(safe-area-inset-top))
                24px
                max(28px, env(safe-area-inset-bottom));

            flex-direction: column;

            background:
                radial-gradient(
                    circle at 85% 8%,
                    rgba(255, 255, 255, 0.78),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 8% 84%,
                    rgba(255, 174, 205, 0.35),
                    transparent 34%
                ),
                linear-gradient(
                    180deg,
                    #ffcddd 0%,
                    #ffe1eb 50%,
                    #fff1f6 100%
                );
        }

        .screen.active {
            display: flex;
        }

        .start-screen {
            justify-content: space-between;
        }

        .start-content {
            margin-top: 72px;
        }

        .brand {
            margin-bottom: 18px;

            color: #dd4c82;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .start-title {
            font-size: 40px;
            line-height: 1.2;

            letter-spacing: -2px;
        }

        .pink-text {
            color: #e74f86;
        }

        .start-description {
            margin-top: 24px;

            color: #805868;

            font-size: 16px;
            line-height: 1.75;
        }

        .start-card {
            margin-top: 34px;

            padding: 20px;

            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 22px;

            background: rgba(255, 255, 255, 0.45);

            color: #77505f;

            font-size: 14px;
            line-height: 1.7;

            backdrop-filter: blur(10px);
        }

        .main-button {
            width: 100%;
            height: 60px;

            border: none;
            border-radius: 19px;

            background: #ed5a90;
            color: white;

            font-size: 17px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 12px 28px
                rgba(218, 65, 121, 0.24);

            transition:
                transform 0.15s ease,
                opacity 0.2s ease;
        }

        .main-button:active {
            transform: scale(0.98);
        }

        .main-button.disabled {
            opacity: 0.38;
            pointer-events: none;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-button {
            width: 44px;
            height: 44px;

            border: none;
            border-radius: 14px;

            background: rgba(255, 255, 255, 0.68);
            color: #6f4556;

            font-size: 22px;
            font-weight: 700;

            cursor: pointer;
        }

        .step {
            color: #bd6688;

            font-size: 14px;
            font-weight: 800;
        }

        .progress {
            width: 100%;
            height: 7px;

            margin-top: 24px;

            overflow: hidden;

            border-radius: 100px;

            background: rgba(255, 255, 255, 0.65);
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            border-radius: 100px;

            background: #ed5a90;

            transition: width 0.3s ease;
        }

        .question-area {
            margin-top: 50px;
        }

        .question-label {
            margin-bottom: 12px;

            color: #dd4c82;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 1.4px;
        }

        .question-title {
            font-size: 29px;
            line-height: 1.35;

            letter-spacing: -1.2px;
        }

        .question-description {
            margin-top: 12px;

            color: #8b6473;

            font-size: 15px;
            line-height: 1.6;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 13px;

            margin-top: 36px;
        }

        .option {
            width: 100%;
            min-height: 68px;

            padding: 0 21px;

            border: 2px solid transparent;
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.74);
            color: #4b303b;

            font-size: 17px;
            font-weight: 800;

            text-align: left;

            cursor: pointer;

            box-shadow:
                0 5px 18px
                rgba(174, 75, 111, 0.06);

            transition:
                transform 0.15s ease,
                background 0.2s ease,
                border 0.2s ease;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option.selected {
            border-color: #ed5a90;
            background: white;
            color: #e3477f;

            box-shadow:
                0 9px 25px
                rgba(218, 65, 121, 0.13);
        }

        .option.unknown {
            color: #8c6877;
        }

        .option.diogenes {
            color: #7e5364;
        }

        .bottom-area {
            margin-top: auto;
            padding-top: 28px;
        }

        .result-screen {
            text-align: center;
        }

        .result-top {
            margin-top: 20px;
        }

        .result-label {
            color: #dd4c82;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 2px;
        }

        .result-heading {
            margin-top: 12px;

            font-size: 25px;
            line-height: 1.4;

            letter-spacing: -1px;
        }

        .result-card {
            width: 100%;

            margin-top: 28px;
            padding: 30px 22px;

            border: 1px solid rgba(255, 255, 255, 0.82);
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.72);

            box-shadow:
                0 18px 45px
                rgba(210, 72, 123, 0.13);

            backdrop-filter: blur(10px);
        }

        .result-era {
            color: #c66b8d;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .result-name {
            margin-top: 8px;

            color: #38242c;

            font-size: 38px;
            font-weight: 900;

            letter-spacing: -1.5px;
        }

        .result-subtitle {
            margin-top: 14px;

            color: #e34e84;

            font-size: 18px;
            font-weight: 800;
            line-height: 1.5;
        }

        .divider {
            width: 44px;
            height: 3px;

            margin: 23px auto;

            border-radius: 100px;

            background: #f0a1bd;
        }

        .result-section-label {
            color: #9a7180;

            font-size: 12px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .result-book {
            margin-top: 8px;

            color: #553945;

            font-size: 17px;
            font-weight: 800;
        }

        .result-thought {
            margin-top: 21px;

            padding: 17px;

            border-radius: 17px;

            background: #fff2f6;

            color: #754d5c;

            font-size: 14px;
            line-height: 1.7;

            text-align: left;
        }

        .score-box {
            margin-top: 18px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .score-item {
            padding: 13px 10px;

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.76);

            color: #765060;

            font-size: 13px;
            font-weight: 800;
        }

        .restart-button {
            margin-top: 24px;
        }

        @media (max-width: 370px) {
            .start-title {
                font-size: 35px;
            }

            .question-title {
                font-size: 26px;
            }

            .result-name {
                font-size: 33px;
            }
        }

        @media (min-width: 600px) {
            body {
                background: #f5f5f5;
            }

            .app {
                align-items: center;
                padding: 30px 0;
            }

            .screen {
                min-height: 850px;

                border-radius: 30px;

                box-shadow:
                    0 20px 60px
                    rgba(0, 0, 0, 0.08);
            }
        }
    </style>
</head>

<body>

<main class="app">

    <section class="screen start-screen active" id="startScreen">

        <div class="start-content">

            <p class="brand">
                PHILOSOPHER TEST
            </p>

            <h1 class="start-title">
                두근두근<br>
                <span class="pink-text">
                    당신의 철학자는
                </span>
            </h1>

            <p class="start-description">
                20개의 질문으로 알아보는<br>
                나와 가장 가까운 철학자
            </p>

            <div class="start-card">
                어려운 철학 지식은 필요 없습니다.
                평소 생각에 더 가까운 답을 선택하면
                결과를 계산합니다.
            </div>

        </div>

        <button class="main-button" id="startButton">
            시작하기
        </button>

    </section>


    <section class="screen" id="questionScreen">

        <div class="top-bar">

            <button class="back-button" id="backButton">
                &lt;
            </button>

            <span class="step" id="stepText">
                1 / 20
            </span>

        </div>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="question-area">

            <p class="question-label" id="questionLabel">
                QUESTION 01
            </p>

            <h2 class="question-title" id="questionTitle"></h2>

            <p
                class="question-description"
                id="questionDescription"
            ></p>

        </div>

        <div class="options" id="options"></div>

        <div class="bottom-area">

            <button
                class="main-button disabled"
                id="confirmButton"
            >
                확인
            </button>

        </div>

    </section>


    <section class="screen result-screen" id="resultScreen">

        <div class="result-top">

            <p class="result-label">
                YOUR PHILOSOPHER
            </p>

            <h2 class="result-heading">
                당신과 가장 잘 맞는 철학자는
            </h2>

        </div>

        <div class="result-card">

            <p class="result-era" id="resultEra"></p>

            <h2 class="result-name" id="resultName"></h2>

            <p
                class="result-subtitle"
                id="resultSubtitle"
            ></p>

            <div class="divider"></div>

            <p class="result-section-label">
                대표 저서 또는 문헌
            </p>

            <p
                class="result-book"
                id="resultBook"
            ></p>

            <div
                class="result-thought"
                id="resultThought"
            ></div>

            <div class="score-box">
                <div class="score-item" id="score1"></div>
                <div class="score-item" id="score2"></div>
                <div class="score-item" id="score3"></div>
                <div class="score-item" id="score4"></div>
            </div>

        </div>

        <button
            class="main-button restart-button"
            id="restartButton"
        >
            다시 하기
        </button>

    </section>

</main>


<script>

const questions = [

    {
        key: "era",
        title: "어느 시대의 철학이 더 끌리나요?",
        description: "직감적으로 더 궁금한 시대를 골라보세요.",
        options: [
            ["고대", "ancient"],
            ["근대", "modern"],
            ["현대", "contemporary"],
            ["모르겠다", "unknown"],

    {

        ]

        options: [
            ["받아들인다", "accept"],
            ["맞선다", "resist"],
            ["모르겠다", "unknown"]
        ]

    {

    {

        title: "인간의 삶은 어느 쪽에 가까울까요?",

    {
        key: "q7",
        title: "욕망은 어떻게 해야 할까요?",

    {

            ["모르겠다", "unknown"]
        ]
    },

    {

    {

        description: "더 중요한 쪽을 골라보세요.",
        options: [

const philosophers = [

const progressBar =
    document.getElementById("progressBar");

const questionLabel =
    document.getElementById("questionLabel");

const questionTitle =
    document.getElementById("questionTitle");

const questionDescription =
    document.getElementById("questionDescription");

const optionsContainer =
    document.getElementById("options");

const resultEra =
    document.getElementById("resultEra");

const resultName =
    document.getElementById("resultName");

const resultSubtitle =
    document.getElementById("resultSubtitle");

const resultBook =
    document.getElementById("resultBook");

const resultThought =
    document.getElementById("resultThought");

const score1 =
    document.getElementById("score1");

const score2 =
    document.getElementById("score2");

const score3 =
    document.getElementById("score3");

const score4 =
    document.getElementById("score4");


function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(function(item) {
            item.classList.remove("active");
        });

    screen.classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function renderQuestion() {

    const question =
        questions[currentQuestion];

    currentSelection =
        answers[question.key] || null;

    stepText.textContent =
        (currentQuestion + 1)
        + " / "
        + questions.length;

    questionLabel.textContent =
        "QUESTION "
        + String(
            currentQuestion + 1
        ).padStart(2, "0");

    questionTitle.textContent =
        question.title;

    questionDescription.textContent =
        question.description;

    const progress =
        (
            (currentQuestion + 1)
            / questions.length
        ) * 100;

    progressBar.style.width =
        progress + "%";

    optionsContainer.innerHTML = "";

    question.options.forEach(
        function(optionData) {

            const text =
                optionData[0];

            const value =
                optionData[1];

            const button =
                document.createElement("button");

            button.className =
                "option";

            if (value === "unknown") {
                button.classList.add(
                    "unknown"
                );
            }

            if (value === "diogenes") {
                button.classList.add(
                    "diogenes"
                );
            }

            button.textContent =
                text;

            button.dataset.value =
                value;

            if (
                currentSelection
                === value
            ) {
                button.classList.add(
                    "selected"
                );
            }

            button.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(
                            ".option"
                        )
                        .forEach(
                            function(item) {
                                item.classList.remove(
                                    "selected"
                                );
                            }
                        );

                    button.classList.add(
                        "selected"
                    );

                    currentSelection =
                        value;

                    confirmButton.classList.remove(
                        "disabled"
                    );
                }
            );

            optionsContainer.appendChild(
                button
            );
        }
    );

    if (currentSelection) {
        confirmButton.classList.remove(
            "disabled"
        );
    } else {
        confirmButton.classList.add(
            "disabled"
        );
    }

    if (
        currentQuestion
        === questions.length - 1
    ) {
        confirmButton.textContent =
            "결과 보기";
    } else {
        confirmButton.textContent =
            "확인";
    }

}


function getUnknownCount() {

    return Object
        .values(answers)
        .filter(
            function(value) {
                return value === "unknown";
            }
        )
        .length;

}


function getCandidates() {

    const selectedEra =
        answers.era;

    const selectedRegion =
        answers.region;

    return philosophers.filter(
        function(philosopher) {

            const eraMatch =
                selectedEra === "unknown"
                || philosopher.group[0]
                === selectedEra;

            const regionMatch =
                selectedRegion === "unknown"
                || philosopher.group[1]
                === selectedRegion;

            return (
                eraMatch
                && regionMatch
            );
        }
    );

}


function calculateScore(philosopher) {

    let score = 0;

    Object.values(answers).forEach(
        function(answer) {

            if (
                philosopher.traits.includes(
                    answer
                )
            ) {
                score += 2;
            }

        }
    );

    const unknownCount =
        getUnknownCount();

    if (
        philosopher.name === "피론"
        && unknownCount >= 5
    ) {
        score += unknownCount;
    }

    return score;

}


function getPhilosopher() {

    let candidates =
        getCandidates();

    if (
        candidates.length === 0
    ) {
        candidates =
            philosophers;
    }

    let best =
        candidates[0];

    let bestScore =
        -Infinity;

    candidates.forEach(
        function(philosopher) {

            const score =
                calculateScore(
                    philosopher
                );

            if (
                score > bestScore
            ) {

                bestScore =
                    score;

                best =
                    philosopher;

            }

        }
    );

    return best;

}


function getUserStats() {

    const values =
        Object.values(answers);

    const countTrait =
        function(traits) {

            let count = 0;

            values.forEach(
                function(value) {

                    if (
                        traits.includes(
                            value
                        )
                    ) {
                        count++;
                    }

                }
            );

            return count;
        };


    const freedom =
        countTrait([
            "freedom",
            "individual",
            "challenge",
            "resist",
            "meaning_create"
        ]);

    const reason =
        countTrait([
            "reason",
            "truth",
            "doubt",
            "principle"
        ]);

    const community =
        countTrait([
            "community",
            "good",
            "reform"
        ]);

    const peace =
        countTrait([
            "peace",
            "accept",
            "restraint",
            "withdraw"
        ]);


    return {
        freedom:
            Math.min(
                99,
                45 + freedom * 8
            ),

        reason:
            Math.min(
                99,
                45 + reason * 8
            ),

        community:
            Math.min(
                99,
                45 + community * 9
            ),

        peace:
            Math.min(
                99,
                45 + peace * 9
            )
    };

}


function displayResult(philosopher) {

    resultEra.textContent =
        philosopher.era;

    resultName.textContent =
        philosopher.name;

    resultSubtitle.textContent =
        philosopher.subtitle;

    resultBook.textContent =
        philosopher.book;

    resultThought.textContent =
        philosopher.thought;


    if (
        philosopher.name
        === "디오게네스"
    ) {

        score1.textContent =
            "자유 99%";

        score2.textContent =
            "체면 1%";

        score3.textContent =
            "관습 2%";

        score4.textContent =
            "마이웨이 100%";

    } else {

        const stats =
            getUserStats();

        score1.textContent =
            "자유 "
            + stats.freedom
            + "%";

        score2.textContent =
            "이성 "
            + stats.reason
            + "%";

        score3.textContent =
            "공동체 "
            + stats.community
            + "%";

        score4.textContent =
            "평온 "
            + stats.peace
            + "%";

    }

    showScreen(
        resultScreen
    );

}


startButton.addEventListener(
    "click",
    function() {

        currentQuestion = 0;
        currentSelection = null;

        showScreen(
            questionScreen
        );

        renderQuestion();

    }
);


confirmButton.addEventListener(
    "click",
    function() {

        if (!currentSelection) {
            return;
        }

        if (
            currentQuestion === 0
            && currentSelection
            === "diogenes"
        ) {

            displayResult(
                diogenes
            );

            return;
        }

        const question =
            questions[currentQuestion];

        answers[question.key] =
            currentSelection;

        if (
            currentQuestion
            < questions.length - 1
        ) {

            currentQuestion++;

            renderQuestion();

        } else {

            const result =
                getPhilosopher();

            displayResult(
                result
            );

        }

    }
);


backButton.addEventListener(
    "click",
    function() {

        if (
            currentQuestion === 0
        ) {

            showScreen(
                startScreen
            );

            return;
        }

        currentQuestion--;

        renderQuestion();

    }
);


restartButton.addEventListener(
    "click",
    function() {

        Object
            .keys(answers)
            .forEach(
                function(key) {
                    delete answers[key];
                }
            );

        currentQuestion = 0;
        currentSelection = null;

        showScreen(
            startScreen
        );

    }
);

</script>

</body>
</html>
